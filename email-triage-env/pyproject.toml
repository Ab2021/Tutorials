[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "email-triage-env"
version = "1.0.0"
description = "Email Triage RL Environment — Classify emails by department and priority"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
openenv = ["openenv-core>=0.1.0"]
inference = ["openai>=1.0.0"]
dev = ["pytest", "httpx"]
