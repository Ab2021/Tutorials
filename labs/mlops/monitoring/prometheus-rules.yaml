groups:
  - name: biomed-risk-service
    rules:
      - alert: HighErrorRate
        expr: sum(rate(biomed_http_requests_total{status=~"5.."}[5m])) / sum(rate(biomed_http_requests_total[5m])) > 0.02
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "Risk service 5xx rate > 2% for 10m"
      - alert: HighP99Latency
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "p99 latency > 2s for 10m"
      - alert: NoPredictions
        expr: increase(biomed_predictions_total[30m]) == 0
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "No predictions in 30m; check traffic or service health"
