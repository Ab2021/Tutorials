apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: risk-service
  namespace: biomed
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: risk.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: risk-service
                port:
                  number: 80
  tls:
    - hosts: ["risk.example.org"]
      secretName: risk-service-tls
